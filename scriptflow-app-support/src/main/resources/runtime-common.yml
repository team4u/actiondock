spring:
  datasource:
    url: jdbc:h2:file:./data/dsl-runtime;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  execution:
    async-pool-size: 4
