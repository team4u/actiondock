name: jDeploy Desktop Release

on:
  release:
    types:
      - published
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: jdeploy-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-installers:
    name: Build desktop installers
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            actiondock-cli/package-lock.json
            actiondock-admin-ui/package-lock.json

      - name: Install package dependencies
        working-directory: actiondock-cli
        run: npm ci

      - name: Build unified jDeploy package
        working-directory: actiondock-cli
        run: npm run prepack

      - name: Stage unified jDeploy package at repository root
        run: |
          rm -rf bin dist runtime jdeploy-bundle package.json README.md
          cp actiondock-cli/package.json package.json
          cp actiondock-cli/README.md README.md
          cp -R actiondock-cli/bin bin
          cp -R actiondock-cli/dist dist
          cp -R actiondock-cli/runtime runtime
          cp -R actiondock-cli/jdeploy-bundle jdeploy-bundle

      - name: Build and upload desktop installers
        uses: shannah/jdeploy@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          jdeploy_version: "6.1.3"
