name: Publish Packages

on:
  push:
    tags:
      - "v*"
      - "[0-9]+.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Verify & Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: npm ci

      - name: Sync Monorepo Versions from Tag
        run: node ./scripts/bump-version.ts --from-git-tag

      - name: Build Packages
        run: npm run build

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Pack Smoke Test
        run: npm run test:pack

      - name: Publish Packages with Isolated Temp Dist-Tag & Atomic Switch
        run: node ./scripts/publish.ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
