name: Publish Packages

on:
  push:
    tags:
      - "v*"
      - "[0-9]+.*"

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Verify (Node 24, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Install Dependencies
        run: npm ci

      - name: Sync Monorepo Versions from Tag
        run: node ./scripts/bump-version.ts --from-git-tag

      - name: Build Packages
        run: npm run build

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Run Monorepo Tests
        run: npm test

      - name: Pack Smoke Test
        run: npm run test:pack

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Install Dependencies
        run: npm ci

      - name: Sync Monorepo Versions from Tag
        run: node ./scripts/bump-version.ts --from-git-tag

      - name: Build Packages
        run: npm run build

      - name: Publish Packages
        run: node ./scripts/publish.ts
