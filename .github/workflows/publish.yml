name: Publish Packages

on:
  push:
    tags:
      - "v*"
      - "[0-9]+.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Verify & Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Update npm
        run: npm install -g npm@latest

      - name: Resolve Distribution Tag
        id: dist-tag
        run: |
          RAW_TAG="${{ github.ref_name }}"
          if [[ "$RAW_TAG" =~ -(beta|alpha|rc|canary|next) ]]; then
            DIST_TAG="${BASH_REMATCH[1]}"
            echo "Pre-release tag detected: $RAW_TAG -> npm tag: $DIST_TAG"
          else
            DIST_TAG="latest"
            echo "Stable release tag detected: $RAW_TAG -> npm tag: $DIST_TAG"
          fi
          echo "tag=$DIST_TAG" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Sync Monorepo Versions from Tag
        run: bun run ./scripts/bump-version.ts --from-git-tag

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Pack Smoke Test
        run: bun run test:pack

      - name: Publish SDK
        working-directory: packages/sdk
        run: npm publish --access public --tag ${{ steps.dist-tag.outputs.tag }}

      - name: Publish Core
        working-directory: packages/core
        run: npm publish --access public --tag ${{ steps.dist-tag.outputs.tag }}

      - name: Publish Testing
        working-directory: packages/testing
        run: npm publish --access public --tag ${{ steps.dist-tag.outputs.tag }}

      - name: Publish Runtime Node
        working-directory: packages/runtime-node
        run: npm publish --access public --tag ${{ steps.dist-tag.outputs.tag }}

      - name: Publish Runtime Bun
        working-directory: packages/runtime-bun
        run: npm publish --access public --tag ${{ steps.dist-tag.outputs.tag }}

      - name: Publish Builder
        working-directory: packages/builder
        run: npm publish --access public --tag ${{ steps.dist-tag.outputs.tag }}

      - name: Publish MCP
        working-directory: packages/mcp
        run: npm publish --access public --tag ${{ steps.dist-tag.outputs.tag }}

      - name: Publish Runtime CLI
        working-directory: packages/runtime-cli
        run: npm publish --access public --tag ${{ steps.dist-tag.outputs.tag }}

      - name: Publish CLI
        working-directory: packages/cli
        run: npm publish --access public --tag ${{ steps.dist-tag.outputs.tag }}

