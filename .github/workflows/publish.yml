name: Publish Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "发布目标版本号"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Verify (Node 24, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Install Dependencies
        run: npm ci

      - name: Sync Monorepo Versions from Release
        run: node ./scripts/bump-version.ts "${{ github.event.release.tag_name || inputs.version || github.ref_name }}"

      - name: Build Packages
        run: npm run build

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Run Monorepo Tests
        run: npm test

      - name: Pack Smoke Test
        run: npm run test:pack

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Install Dependencies
        run: npm ci

      - name: Sync Monorepo Versions from Release
        run: node ./scripts/bump-version.ts "${{ github.event.release.tag_name || inputs.version || github.ref_name }}"

      - name: Build Packages
        run: npm run build

      - name: Publish Packages
        run: node ./scripts/publish.ts
