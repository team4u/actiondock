name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Typecheck & Test (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: TypeScript Typecheck
        run: bun run typecheck

      - name: Run Monorepo Tests
        run: bun test
