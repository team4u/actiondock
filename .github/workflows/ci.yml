name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Typecheck & Test (Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Build Packages
        run: npm run build

      - name: Run Monorepo Tests
        run: npm test

  pack-smoke:
    name: Pack Smoke Test (Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Install Dependencies
        run: npm ci

      - name: Build Packages
        run: npm run build

      - name: Run Pack Smoke Test
        run: npm run test:pack
