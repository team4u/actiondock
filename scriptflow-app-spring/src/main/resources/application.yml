spring:
  config:
    import: classpath:runtime-common.yml
  application:
    name: scriptflow-app-spring
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  auth:
    api-keys: []
